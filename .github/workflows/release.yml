name: Release

# Cut a release:
#
#   npm run release -- 1.0.1 --push      # drafts release notes, bumps plugin.json+package.json, commits, tags, pushes
#
# The tag push runs the shared release workflow (jaysuk/dwc-plugin-workflows), which builds
# FlexibleLayouts-<version>.zip against DWC and publishes a Release with a pun title and
# generated notes. Run it by hand (Actions -> Release -> Run workflow) for a dry run: it builds the
# ZIP as an artifact and shows the title and notes in the run summary, publishing nothing.
#
# Plugin-specific bits: scripts/release-titles.txt (the puns) and .github/release-footer.md (extra notes in
# the footer).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dwc-ref:
        description: DuetWebControl branch/tag/sha to build against
        default: v3.7-dev

permissions:
  contents: write # the shared workflow creates the Release and uploads the asset

jobs:
  release:
    uses: jaysuk/dwc-plugin-workflows/.github/workflows/release.yml@v1
    with:
      dwc-ref: ${{ inputs.dwc-ref }}
